[package]
name = "edgecube_daemon"
version = "2.0.0"
edition = "2024"
description = "EdgeCube 后端 Daemon"
license = "GPL-3.0-or-later"
repository = "https://github.com/venti1112/EdgeCube"
default-run = "edgecube-daemon"

[lib]
name = "edgecube_daemon"
path = "src/lib.rs"

[[bin]]
name = "edgecube-daemon"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "http1", "json", "tokio"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "net",
    "fs",
] }
tokio-util = "0.7"
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "ansi"] }

[dev-dependencies]
tokio-tungstenite = "0.28"

[profile.release]
lto = "thin"
strip = true
