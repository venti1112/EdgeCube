openapi: 3.0.3
info:
  title: EdgeCube Daemon API
  description: |
    EdgeCube v2 守护进程 API(唯一契约)。

    - 契约优先:所有 API 变更先改本文件,再由生成器产出双端代码
      (Rust daemon / Flutter client),任何一端不得绕过契约私自改协议。
    - 实现阶段标记:每个 path 的 `x-phase` 标注落地阶段(0/1/2/3),对应
      docs/PLAN.md §10 分阶段路线。
    - WS 部分(events / terminal)不在 OpenAPI 能力范围内,见同目录 `ws.md`。
    - 鉴权:除 /auth/* 与 /health 外全部需要 `Authorization: Bearer <token>`;
      6 位对码经 `auth/pair` 换取长期 token。
  version: 0.1.0
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://{host}:{port}/api/v1
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "8760"

tags:
  - name: auth
    description: 鉴权与配对
  - name: instances
    description: 实例管理(多实例并发,操作按 instanceId 定位)
  - name: tasks
    description: 任务队列(异步操作 202 受理后的执行状态/进度/取消)
  - name: runtimes
    description: 运行时管理(java/php/frpc,统一目录,官方源下载)
  - name: files
    description: 文件管理(以实例 cwd 为根的沙箱)
  - name: backup
    description: 备份(本地 zip + FTP/SFTP 目标)
  - name: ftp
    description: FTP 服务
  - name: ssh
    description: SSH 服务
  - name: config
    description: 设置项读写
  - name: catalog
    description: 服务端版本目录(下载服务端向导数据源,daemon 代理第三方源)
  - name: monitor
    description: 系统监控
  - name: players
    description: 玩家管理(在线玩家 + 白名单/封禁/IP封禁/OP 名单快照)
  - name: transfer
    description: 实例迁移(导出打包 + 导入还原,跨设备搬运实例)
  - name: server-core
    description: 服务端核心更新(Paper/Bukkit 等服务端 jar 版本检查与替换)
  - name: health
    description: 健康检查

security:
  - BearerAuth: []

paths:
  # ────────────────────────── Health ──────────────────────────
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: 健康检查(未配对可访问)
      security: []
      x-phase: 0
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ────────────────────────── Auth ──────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 用户名密码登录,换取长期 token
      description: |
        使用用户名和密码登录。daemon 首次启动时生成随机凭证并打印到控制台;
        未登录设备无需鉴权即可访问本端点(仅局域网可绑定)。
      security: []
      x-phase: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: 修改密码
      x-phase: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 密码已修改
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/change-username:
    post:
      operationId: changeUsername
      tags: [auth]
      summary: 修改用户名
      description: 已登录设备(Bearer token)可直接修改用户名。
      x-phase: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUsernameRequest"
      responses:
        "204":
          description: 用户名已修改
        "401":
          $ref: "#/components/responses/Unauthorized"
  # 本机免密登录:凭据为 daemon 数据目录内的 local.key。
  # 仅持有该文件的进程(本机 App)可完成;TCP 端口映射仅转发流量、无法读取文件,
  # 因此经映射访问的远端无法免密。区分依据是本机秘密而非来源 IP。
  # 本端点额外严格限制来源必须为回环地址(127.0.0.1/::1):
  # 映射场景下 peer 地址即本机回环,不受影响;而未使用映射时(如局域网绑定),
  # 任何远端(即使意外持有凭证)来源均非回环,一律 403。
  /auth/local-login/challenge:
    post:
      operationId: issueLocalLoginChallenge
      tags: [auth]
      summary: 发起本机免密登录挑战(一次性,短时效)
      description: |
        直连 daemon 的本机客户端免密登录:
        返回一次性 challenge(5 分钟过期,使用后作废),客户端读取数据目录 `local.key`,
        计算 `signature = lowercase(hex(HMAC-SHA256(localKey, challenge)))` 后提交
        `/auth/local-login`。未登录设备无需鉴权(同 /auth/login)。
      security: []
      x-phase: 0
      responses:
        "200":
          description: 挑战已签发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalLoginChallenge"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/local-login:
    post:
      operationId: localLogin
      tags: [auth]
      summary: 本机免密登录,换取长期 token
      description: |
        提交 /auth/local-login/challenge 返回的 challenge 及对应 HMAC 签名。
        签名验证通过即视为本机进程(持有 local.key),签发与 /auth/login 相同的长期 token。
        challenge 一次性使用,重放返回 401。
      security: []
      x-phase: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/tokens:
    get:
      operationId: listDevices
      tags: [auth]
      summary: 已登录设备列表
      x-phase: 0
      responses:
        "200":
          description: 设备列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/tokens/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [auth]
      summary: 吊销指定设备的 token
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: 已吊销
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: renameDevice
      tags: [auth]
      summary: 重命名设备
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameDeviceRequest"
      responses:
        "204":
          description: 已重命名
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ────────────────────────── Instances ──────────────────────────
  /instances:
    get:
      operationId: listInstances
      tags: [instances]
      summary: 实例列表(分页)
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          description: 按名称模糊过滤
          schema:
            type: string
      responses:
        "200":
          description: 分页实例列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstancePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createInstance
      tags: [instances]
      summary: 创建实例
      description: |
        仅 name 必填;startCommand 可为空串(空实例),workingDirectory 缺省由 daemon 分配。
        重名返回 409。
        可选提供 downloadUrl(服务端下载链接) + checksum(校验值):daemon 创建配置后
        自动向任务队列提交下载任务并回写 downloadTaskId,此时返回 202(响应体为完整
        实例配置,含 downloadTaskId),客户端用 `GET /tasks/{downloadTaskId}` 查询下载
        进度;下载完成该任务终结,实例方可启动。
        downloadUrl 仅创建时生效;不带 downloadUrl 时同步返回 201 完整配置。
      x-phase: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceConfig"
      responses:
        "201":
          description: 创建成功(无下载)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceConfig"
        "202":
          description: 已受理,下载进行中(带 downloadUrl 时);响应体为完整实例配置(含 downloadTaskId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceConfig"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/overview:
    get:
      operationId: getInstancesOverview
      tags: [instances]
      summary: 全部实例状态聚合(首页看板)
      description: |
        返回所有实例的概要 + 运行中实例数量,供 UI 首页一次性渲染;
        实时变化经 WS `instance/state` 事件推送。
      x-phase: 0
      responses:
        "200":
          description: 状态聚合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/{instanceId}:
    get:
      operationId: getInstance
      tags: [instances]
      summary: 实例详情(配置 + 运行状态)
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: 实例详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateInstance
      tags: [instances]
      summary: 更新实例配置
      description: |
        运行中实例的以下字段不可变更(需先停止):startCommand、workingDirectory、
        type、runtimeId、terminal.pty、inputEncoding、outputEncoding。其余字段热更新。
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceConfig"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceConfig"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteInstance
      tags: [instances]
      summary: 删除实例
      description: 运行中的实例必须先停止;仅删除配置与进程,不删除工作目录。
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "204":
          description: 已删除
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances/{instanceId}/start:
    post:
      operationId: startInstance
      tags: [instances]
      summary: 启动实例
      description: |
        完整多实例并发:任意数量实例可同时运行,互不干扰。
        含首次启动的目录检查、锁与失败兜底 kill。
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "202":
          description: 已受理启动
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances/{instanceId}/stop:
    post:
      operationId: stopInstance
      tags: [instances]
      summary: 优雅停止(发送 stopCommand,默认 ^C)
      description: stopCommand 超时(可配,默认 600s)后自动升级为强杀。
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "202":
          description: 已受理停止
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances/{instanceId}/restart:
    post:
      operationId: restartInstance
      tags: [instances]
      summary: 重启(停止完成后自动重新启动)
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "202":
          description: 已受理重启
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances/{instanceId}/kill:
    post:
      operationId: killInstance
      tags: [instances]
      summary: 强制结束进程(进程树)
      description: 启动后 6 秒内禁止强杀(防误触);跨平台进程树杀死。
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "202":
          description: 已受理强杀
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances/{instanceId}/command:
    post:
      operationId: sendInstanceCommand
      tags: [instances]
      summary: 程序化发送一行命令(命令框通道)
      description: |
        结构化命令入口,对应终端协议中的 `input` 帧;
        按实例配置可被替换为 RCON 等实现(附加层)。
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "202":
          description: 已写入
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances/{instanceId}/log:
    get:
      operationId: getInstanceLog
      tags: [instances]
      summary: 增量日志拉取(重连回放)
      description: |
        `since` 为日志行序号(非时间戳),从 0 开始单调递增;
        订阅 WS 后实时行由 `instance/stdout` 推送,本端点用于断线补拉。
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: since
          in: query
          description: 起始行序号(含)
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: 最大行数
          schema:
            type: integer
            maximum: 5000
            default: 5000
      responses:
        "200":
          description: 日志行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/{instanceId}/outputlog:
    get:
      operationId: getInstanceOutputLog
      tags: [instances]
      summary: 持久化日志文件内容(完整回放/导出)
      description: 返回该实例的日志文件全文(512KB 轮换,最大保留最近两卷)。
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: 日志文本
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/{instanceId}/process-config:
    get:
      operationId: getInstanceProcessConfig
      tags: [instances]
      summary: 读取实例配置文件(server.properties 等)
      description: |
        按文件名自动选择解析器:properties / yml / json / txt。
        大整数以字符串返回避免精度丢失。
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: file
          in: query
          required: true
          description: 配置文件名,如 server.properties(相对实例 cwd)
          schema:
            type: string
      responses:
        "200":
          description: 解析后的键值
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessConfig"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateInstanceProcessConfig
      tags: [instances]
      summary: 写回实例配置文件
      x-phase: 1
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: file
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessConfig"
      responses:
        "200":
          description: 已写回
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances/{instanceId}/export:
    post:
      operationId: exportInstance
      tags: [instances]
      summary: 导出实例(打包工作目录为归档)
      description: |
        将实例配置与工作目录打包为归档(zip/tar.gz,可排除 logs 目录),存入
        daemon 的 `exports` 目录。返回 202 受理(JobAccepted),任务完成
        (GET /tasks/{jobId} = succeeded)后经 GET /instances/{instanceId}/export/download
        下载归档。导出期间实例必须处于 Stopped(运行中返回 409 instance_busy)。
        同一实例的导出任务串行,进行中的导出重复提交返回 409 task_conflict。
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: 已开始导出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances/{instanceId}/export/download:
    get:
      operationId: downloadInstanceExport
      tags: [transfer]
      summary: 下载已完成的导出归档
      description: |
        按导出任务 id 下载归档文件(application/octet-stream 流式返回)。
        归档同时包含实例配置(config.json)与 `files` 目录内容,可用
        POST /instances/import 在任意设备还原。文件在导出目录中保留
        24 小时,过期或被新导出覆盖后返回 404。
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/ExportTaskId"
      responses:
        "200":
          description: 归档文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances/import:
    post:
      operationId: importInstance
      tags: [transfer]
      summary: 导入实例(从导出归档还原为新实例)
      description: |
        归档文件须先经 /fs/upload-* 上传到某实例的 cwd(sourceInstanceId 指定该实例),
        导入时 daemon 校验归档结构(须含 config.json 与 files/ 目录)后创建新实例:
        新实例 id 重新生成,cwd 落到新工作目录,配置中的 name 与 runtime 等
        字段按需映射。返回 202 受理(JobAccepted),任务完成
        (GET /tasks/{jobId} = succeeded)后新实例出现在实例列表。
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: 已受理,开始导入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ────────────────────────── 服务端核心更新 ──────────────────────────
  /instances/{instanceId}/core-update/check:
    get:
      operationId: checkServerCoreUpdate
      tags: [server-core]
      summary: 检查服务端核心是否有新版本(Paper 系)
      description: |
        daemon 代理 PaperMC 官方 API:对 java 实例按其启动命令中的核心 jar
        (server.jar/paper-*.jar 等)与版本目录推导当前服务端,若为 Paper 系
        (Paper/Purpur/Spigot/CraftBukkit 由版本目录识别,识别不了按最新版判断)
        则返回最新版本/构建/下载地址与当前版本对比结果。非 java 实例或不支持
        更新来源时返回 `source: unknown / supported: false`。
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: 更新检查结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerCoreUpdateCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances/{instanceId}/core-update:
    post:
      operationId: updateServerCore
      tags: [server-core]
      summary: 更新服务端核心(jar 替换,Paper 系)
      description: |
        按检查结果下载最新核心 jar 并替换现有 jar(旧 jar 重命名为 `.disabled`)。
        实例必须处于 Stopped;任务进度经 GET /tasks/{jobId} 轮询,完成后
        GET /instances/{instanceId}/core-update/check 的 currentVersion 即更新。
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerCoreUpdateRequest"
      responses:
        "202":
          description: 已受理,开始更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ────────────────────────── 插件/模组元数据 ──────────────────────────
  # 元数据检查放在后端:前端先经 /fs/list 展示文件列表,再提交 analyze 创建解析任务
  # (TaskKind=analyze,按 instanceId 分组 FIFO 串行),轮询 GET /tasks/{jobId} 状态,
  # 成功后经 GET mods/metadata 拉取解析结果。
  /instances/{instanceId}/mods/analyze:
    post:
      operationId: analyzeInstanceMods
      tags: [instances]
      summary: 提交插件/模组元数据解析任务
      description: |
        扫描指定目录(相对实例 cwd,如 plugins / mods)内所有 .jar/.phar 文件,
        在服务端解析元数据并缓存。返回 202 受理(JobAccepted),任务状态经
        GET /tasks/{jobId} 轮询,完成后用 GET mods/metadata 拉取结果。
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModsAnalyzeRequest"
      responses:
        "202":
          description: 已受理,返回解析任务 id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/{instanceId}/mods/metadata:
    get:
      operationId: getInstanceModsMetadata
      tags: [instances]
      summary: 获取插件/模组解析结果列表
      description: |
        列出指定目录(相对实例 cwd)内插件/模组文件的解析结果;
        未识别或尚未解析的文件 metadata 为 null。
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: path
          in: query
          required: true
          description: 相对实例 cwd 的目录,如 plugins / mods
          schema:
            type: string
      responses:
        "200":
          description: 解析结果列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModMetadataListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # ────────────────────────── 插件/模组下载与市场 ──────────────────────────
  # 单文件下载走 V2 任务系统(TaskKind=download_single_file):每个任务内部绑定一个
  # aria2 下载 gid,允许覆盖同名目标文件,前端按目标路径去重,队列状态经 GET /tasks
  # (按 instanceId 过滤,kind=download_single_file)查看。市场搜索/版本/更新检查
  # 等网络调用全部收敛在后端代理(前端不直连 Modrinth/Poggit)。
  /instances/{instanceId}/mods/download:
    post:
      operationId: downloadInstanceMod
      tags: [instances]
      summary: 提交单文件下载任务(模组/插件)
      description: |
        通用单文件下载:下载 `url` 到实例 cwd 下 `destPath` 目录(文件名取
        `fileName`,缺省取 URL 末段)。已存在的同名文件直接覆盖。可选
        `replacePath` 指定更新替换的旧文件,下载成功后将其重命名为
        `<replacePath>.disabled`(禁用旧版而非删除)。返回 202 受理
        (JobAccepted),任务按 instanceId 分组 FIFO 串行(多个下载排队执行),
        进度/状态经 GET /tasks/{jobId} 轮询,可 DELETE /tasks/{jobId} 取消。
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModDownloadRequest"
      responses:
        "202":
          description: 已受理,返回下载任务 id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /instances/{instanceId}/mods/downloads:
    delete:
      operationId: clearFinishedModDownloads
      tags: [instances]
      summary: 清除该实例已终结的下载任务
      description: |
        移除该实例所有已终结(succeeded/failed/cancelled)的
        download_single_file 任务(下载队列「清除已完成」)。
        进行中(queued/running)任务不受影响。返回清除数量。
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: 已清除
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared:
                    type: integer
                    format: int64
                    description: 被清除的任务数量
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # ────────────────────────── 玩家管理 ──────────────────────────
  # 玩家名单(白名单/OP/封禁/IP 封禁)读取实例 cwd 下各服务端格式文件
  # (JSON 优先,txt 回退);在线玩家集合由 daemon 从实例控制台输出解析维护
  # (join/leave/list)。本端点只读,增删操作经 POST /instances/{instanceId}/command
  # 下发 kick/whitelist/op/deop/ban/pardon/ban-ip/pardon-ip 等命令。
  /instances/{instanceId}/players:
    get:
      operationId: getInstancePlayers
      tags: [players]
      summary: 获取玩家管理聚合快照(在线玩家 + 白名单/封禁/IP封禁/OP 名单)
      description: |
        返回当前实例的在线玩家名与四类名单快照,以及实例运行状态
        (前端据此决定仅运行时才允许的增删操作)。
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: 玩家管理快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # ────────── Modrinth 代理(网络收敛在后端) ──────────
  /mods/modrinth/search:
    get:
      operationId: modrinthSearch
      tags: [mods]
      summary: Modrinth 搜索(代理)
      x-phase: 2
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
        - name: offset
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, format: int64, default: 20 }
        - name: gameVersion
          in: query
          schema: { type: string }
        - name: loader
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, default: relevance }
        - name: projectType
          in: query
          schema: { type: string, default: mod, description: mod=模组, plugin=插件 }
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModrinthSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mods/modrinth/project/{projectId}/versions:
    get:
      operationId: modrinthProjectVersions
      tags: [mods]
      summary: 项目版本列表(代理)
      x-phase: 2
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: gameVersion
          in: query
          schema: { type: string }
        - name: loader
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModrinthVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mods/modrinth/projects:
    get:
      operationId: modrinthProjects
      tags: [mods]
      summary: 批量项目信息(图标/标题,代理)
      x-phase: 2
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            items: { type: string }
            description: Modrinth project id 列表
      responses:
        "200":
          description: 项目信息列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModrinthProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mods/modrinth/version-files:
    post:
      operationId: modrinthVersionFiles
      tags: [mods]
      summary: 按 SHA1 查版本(更新检查,代理)
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hashes]
              properties:
                hashes:
                  type: array
                  items: { type: string }
                  description: 文件 SHA1(小写 hex)列表
      responses:
        "200":
          description: "map: sha1 -> 版本"
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ModrinthVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mods/modrinth/game-versions:
    get:
      operationId: modrinthGameVersions
      tags: [mods]
      summary: 游戏版本列表(筛选数据源,代理)
      x-phase: 2
      responses:
        "200":
          description: 游戏版本列表
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
  # ────────── Poggit 代理(网络收敛在后端) ──────────
  /mods/poggit/plugins:
    get:
      operationId: poggitPlugins
      tags: [mods]
      summary: Poggit 全量发布列表(带缓存,代理)
      x-phase: 2
      responses:
        "200":
          description: 发布列表(releases.min.json 原样透传)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PoggitPlugin"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # ────────────────────────── Tasks ──────────────────────────
  # 任务队列:所有 202 异步操作(start/stop/restart/kill/install/trigger 等)受理
  # 后生成一个 Task,状态/进度经 WS `task/progress` 推送,列表/详情/取消走本组端点。
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: 任务列表(进行中优先 + 最近完成)
      description: |
        进行中(queued/running)任务在前,其余按创建时间倒序。
        可选按 instanceId / status 过滤。
      x-phase: 0
      parameters:
        - name: instanceId
          in: query
          description: 按实例过滤;缺省返回全部
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: 按状态过滤
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tasks/{jobId}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: 查询单个任务
      description: |
        返回任务详情;下载类任务运行时 progress 携带实时进度
        (已下载/总大小/速度/预计剩余时间)。
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: cancelTask
      tags: [tasks]
      summary: 取消任务
      description: |
        queued 任务直接移除;running 任务置取消标志,由执行体尽快中断。
        已结束(succeeded/failed/cancelled)任务不可取消,返回 409。
        取消结果回显最终 Task(status=cancelled)。
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 已取消,回显最终状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ────────────────────────── Runtimes ──────────────────────────
  /runtimes:
    get:
      operationId: listRuntimes
      tags: [runtimes]
      summary: 已安装运行时列表
      x-phase: 1
      responses:
        "200":
          description: 运行时列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /runtimes/catalog:
    get:
      operationId: getRuntimeCatalog
      tags: [runtimes]
      summary: 可安装版本清单(官方源)
      description: "拉取对应官方渠道的可用版本(java: Adoptium API;php: 权威预编译源;frpc: GitHub Releases)。"
      x-phase: 1
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RuntimeType"
        - name: includeAll
          in: query
          required: false
          description: "是否拉取全部版本。默认 false 时 frpc 仅返回最新 release(避免无关旧版本请求);true 时返回全部版本。"
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 版本清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /runtimes/install:
    post:
      operationId: installRuntime
      tags: [runtimes]
      summary: 安装运行时(官方源下载,进度走 WS task/progress)
      x-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeInstallRequest"
      responses:
        "202":
          description: 已开始安装
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /runtimes/{runtimeId}:
    delete:
      operationId: deleteRuntime
      tags: [runtimes]
      summary: 卸载运行时
      x-phase: 1
      parameters:
        - name: runtimeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已卸载
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ────────────────────────── Frp(内网穿透) ──────────────────────────
  # 自定义隧道:用户直接填写 frps 服务端地址与代理,daemon 渲染 TOML 后
  # 运行全局唯一的 frpc(frpc 二进制经 /runtimes 安装,来源 fatedier/frp
  # GitHub Releases,支持 linux/windows/darwin × amd64/arm64/386/arm)。
  /frp/tunnels:
    get:
      operationId: listFrpTunnels
      tags: [frp]
      summary: 隧道列表
      description: 隧道列表(不含运行状态,运行状态见 GET /frp/status)
      x-phase: 3
      responses:
        "200":
          description: 隧道列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TunnelInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createFrpTunnel
      tags: [frp]
      summary: 创建隧道
      x-phase: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TunnelInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /frp/tunnels/{tunnelId}:
    get:
      operationId: getFrpTunnel
      tags: [frp]
      summary: 隧道详情
      x-phase: 3
      parameters:
        - name: tunnelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 隧道详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelInfo"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateFrpTunnel
      tags: [frp]
      summary: 更新隧道(全量替换)
      x-phase: 3
      parameters:
        - name: tunnelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TunnelInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteFrpTunnel
      tags: [frp]
      summary: 删除隧道
      x-phase: 3
      parameters:
        - name: tunnelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /frp/start:
    post:
      operationId: startFrpc
      tags: [frp]
      summary: 启动 frpc(全局唯一)
      description: |
        渲染指定隧道的 TOML 并启动全局唯一的 frpc 进程;已有 frpc 运行 →
        409 frpc_busy;未安装 frpc 运行时 → 409 frpc_runtime_missing。
      x-phase: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tunnelId]
              properties:
                tunnelId:
                  type: string
                  format: uuid
      responses:
        "204":
          description: 已启动
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /frp/stop:
    post:
      operationId: stopFrpc
      tags: [frp]
      summary: 停止 frpc
      x-phase: 3
      responses:
        "204":
          description: 已停止
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /frp/status:
    get:
      operationId: getFrpStatus
      tags: [frp]
      summary: frpc 运行状态
      x-phase: 3
      responses:
        "200":
          description: 运行状态(未运行时可含上次退出码)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrpStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /frp/logs:
    get:
      operationId: getFrpLogs
      tags: [frp]
      summary: frpc 日志(最近 tail 行)
      x-phase: 3
      parameters:
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 2000
      responses:
        "200":
          description: 日志行(纯文本数组)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ────────────────────────── Catalog(服务端版本目录) ──────────────────────────
  # 「下载服务端」创建向导的数据源:daemon 代理第三方官方源(V1 的
  # version_fetch_service / download_info_service 逻辑回收至 daemon),
  # 前端一律经本组端点取数,不直连互联网。
  /catalog/server-types:
    get:
      operationId: listServerTypes
      tags: [catalog]
      summary: 可用服务端类型列表(分类/是否带加载器/默认文件名)
      description: |
        静态定义(编译期),随 daemon 发布版本演进。结构:
        - 分类:vanilla / plugin / mod / proxy / bedrock(与 V1 分类树一致)
        - type:原版/插件/代理/基岩端直接用;'bungeecord' 无版本选择,直接下载最新构建
        - hasLoader:true 时(todo: fabric)需走 /catalog/loaders 选择加载器版本
        - fileName:该类型服务端默认落盘文件名(可被 /catalog/download-info 结果覆盖)
      x-phase: 1
      responses:
        "200":
          description: 类型列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerTypeInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /catalog/versions:
    get:
      operationId: listCatalogVersions
      tags: [catalog]
      summary: 版本列表(按服务端类型)
      description: |
        返回该类型可选版本号(降序,最新在前)。
        - hasLoader 类型(如 fabric):本体无独立版本 → 返回 Minecraft 版本列表,
          加载器版本由 /catalog/loaders 另行查询
        - bungeecord:无版本概念,返回空数组
        - pocketmine / powernukkitx:版本号附带对应客户端/mcbe 版本,见
          ServerVersion 的 meta 字段(可选)
      x-phase: 1
      parameters:
        - name: type
          in: query
          required: true
          description: 服务端类型(见 /catalog/server-types)
          schema:
            type: string
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /catalog/loaders:
    get:
      operationId: listCatalogLoaders
      tags: [catalog]
      summary: 加载器版本列表(hasLoader 类型独有)
      description: |
        返回指定 Minecraft 版本的可用加载器版本(降序)。
        目前仅 fabric 为 hasLoader 类型,数据源 meta.fabricmc.net。
      x-phase: 1
      parameters:
        - name: type
          in: query
          required: true
          description: 服务端类型(hasLoader=true 者,如 fabric)
          schema:
            type: string
        - name: mcVersion
          in: query
          required: true
          description: Minecraft 版本号(来自 /catalog/versions)
          schema:
            type: string
      responses:
        "200":
          description: 加载器版本列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /catalog/download-info:
    get:
      operationId: getCatalogDownloadInfo
      tags: [catalog]
      summary: 服务端下载信息(直链 + 校验值 + 落盘文件名)
      description: |
        按选择组装修订下载信息(URL、可选校验值、建议文件名)。
        - 简单类型:type + version
        - hasLoader 类型(如 fabric):type + mcVersion + loaderVersion,
          组装 meta.fabricmc.net 的 server/jar 直链
        - bungeecord:只传 type,取最新构建直链
        校验值格式 "sha1:<hex>" 或 "sha256:<hex>",与创建实例时
        InstanceConfig.checksum 同构(daemon 下载完成后强校验)。
      x-phase: 1
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: 简单类型版本号(hasLoader 类型为 mcVersion 别名,可省略)
          schema:
            type: string
        - name: mcVersion
          in: query
          description: Minecraft 版本号(hasLoader 类型必填)
          schema:
            type: string
        - name: loaderVersion
          in: query
          description: 加载器版本(hasLoader 类型必填)
          schema:
            type: string
      responses:
        "200":
          description: 下载信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerDownloadInfo"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ────────────────────────── Files ──────────────────────────
  /fs/list:
    get:
      operationId: listFiles
      tags: [files]
      summary: 列出目录(沙箱,以实例 cwd 为根)
      x-phase: 2
      parameters:
        - name: instanceId
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: 相对实例 cwd 的路径,空为根
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: 目录内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /fs/download:
    get:
      operationId: downloadFile
      tags: [files]
      summary: 下载文件(二进制流)
      x-phase: 2
      parameters:
        - name: instanceId
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /fs/upload-init:
    post:
      operationId: initFileUpload
      tags: [files]
      summary: 分片上传:初始化
      description: |
        分片断点续传三段式(upload-init / upload-piece / upload-complete),
        对齐 MCSManager /upload-new + /upload-piece 设计。
        分片大小由客户端自定(建议 1-8 MiB),服务端按 offset 写。
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInitRequest"
      responses:
        "200":
          description: 上传会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fs/upload-piece:
    post:
      operationId: uploadFilePiece
      tags: [files]
      summary: 分片上传:写入一片
      x-phase: 2
      parameters:
        - name: uploadId
          in: query
          required: true
          schema:
            type: string
        - name: offset
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 已接收
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fs/upload-complete:
    post:
      operationId: completeFileUpload
      tags: [files]
      summary: 分片上传:完成(校验 sha256)
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompleteRequest"
      responses:
        "200":
          description: 完成,返回落盘路径
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCompleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fs/mkdir:
    post:
      operationId: createDirectory
      tags: [files]
      summary: 创建目录
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsPathRequest"
      responses:
        "201":
          description: 已创建
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fs/move:
    post:
      operationId: moveFile
      tags: [files]
      summary: 移动/重命名
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsMoveRequest"
      responses:
        "204":
          description: 已移动
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /fs/delete:
    post:
      operationId: deleteFile
      tags: [files]
      summary: 删除文件/目录(目录递归)
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsPathRequest"
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /fs/write:
    post:
      operationId: writeFile
      tags: [files]
      summary: 覆盖写入文本文件(内置编辑器保存)
      description: 以 UTF-8 文本整体覆盖写入目标文件(父目录须已存在),服务端以临时文件原子替换。
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsWriteRequest"
      responses:
        "204":
          description: 已写入
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /fs/compress:
    post:
      operationId: compressFile
      tags: [files]
      summary: 压缩为 zip
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsCompressRequest"
      responses:
        "202":
          description: 已开始
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fs/extract:
    post:
      operationId: extractFile
      tags: [files]
      summary: 解压归档(zip/tar/tar.gz)
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsPathRequest"
      responses:
        "202":
          description: 已开始
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # ────────────────────────── Backup ──────────────────────────
  /backup/jobs:
    get:
      operationId: listBackupJobs
      tags: [backup]
      summary: 备份任务列表
      x-phase: 2
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBackupJob
      tags: [backup]
      summary: 创建备份任务
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupJob"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /backup/jobs/{jobId}:
    put:
      operationId: updateBackupJob
      tags: [backup]
      summary: 更新备份任务
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupJob"
      responses:
        "200":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteBackupJob
      tags: [backup]
      summary: 删除备份任务
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
  /backup/jobs/{jobId}/trigger:
    post:
      operationId: triggerBackupJob
      tags: [backup]
      summary: 立即执行备份(进度走 WS backup/progress)
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: 已触发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /backup/targets:
    get:
      operationId: listBackupTargets
      tags: [backup]
      summary: 备份目标列表(local/FTP/SFTP)
      x-phase: 2
      responses:
        "200":
          description: 目标列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBackupTarget
      tags: [backup]
      summary: 创建备份目标
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupTarget"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /backup/targets/{targetId}:
    put:
      operationId: updateBackupTarget
      tags: [backup]
      summary: 更新备份目标
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/TargetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupTarget"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteBackupTarget
      tags: [backup]
      summary: 删除备份目标
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
  # ────────────────────────── FTP / SSH ──────────────────────────
  /ftp:
    get:
      operationId: getFtpStatus
      tags: [ftp]
      summary: FTP 服务状态与配置
      x-phase: 2
      responses:
        "200":
          description: FTP 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FtpStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateFtpConfig
      tags: [ftp]
      summary: 更新 FTP 配置(启用/端口/账号/根目录)
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FtpConfig"
      responses:
        "200":
          description: 已更新(服务运行中则自动重启生效)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FtpStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ssh:
    get:
      operationId: getSshStatus
      tags: [ssh]
      summary: SSH 服务状态与配置
      x-phase: 2
      responses:
        "200":
          description: SSH 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateSshConfig
      tags: [ssh]
      summary: 更新 SSH 配置(启用/端口/账号/根目录)
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SshConfig"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # ────────────────────────── Config ──────────────────────────
  /config/{key}:
    get:
      operationId: getConfigEntry
      tags: [config]
      summary: 读取设置项
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/ConfigKey"
      responses:
        "200":
          description: 设置值
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigEntry"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateConfigEntry
      tags: [config]
      summary: 写入设置项
      x-phase: 0
      parameters:
        - $ref: "#/components/parameters/ConfigKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigEntry"
      responses:
        "200":
          description: 已写入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # ────────────────────────── Monitor ──────────────────────────
  /monitor/snapshot:
    get:
      operationId: getMonitorSnapshot
      tags: [monitor]
      summary: 系统监控快照(实时曲线走 WS monitor/stats)
      x-phase: 1
      responses:
        "200":
          description: 监控快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: auth/login 换取的长期 token

  parameters:
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 实例 id(uuid)
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
      description: 配对设备 id
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 任务 id(即 Task.id,异步操作 202 响应中的 jobId)
    ExportTaskId:
      name: exportTaskId
      in: query
      required: true
      schema:
        type: string
        format: uuid
      description: 导出任务 id(即 POST /instances/{id}/export 返回的 jobId,用于定位导出的归档文件)
    TargetId:
      name: targetId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      description: 页码,从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ConfigKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        example: network

  responses:
    Unauthorized:
      description: 未配对/凭证无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: 请求不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 状态冲突(如运行中重复启动)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 禁止访问(如本机端点被非回环来源调用)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: 内部错误(如进程启动失败)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码,如 not_authenticated / invalid_credentials / instance_busy / not_found
        message:
          type: string
          description: 人类可读错误信息(daemon 侧为英文,UI 按 code 本地化)
        details:
          type: object
          additionalProperties: true

    HealthResponse:
      type: object
      required: [status, version, daemon, platform, uptimeSeconds]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: daemon 版本
        daemon:
          type: string
          enum: [rust]
        platform:
          type: string
          example: linux-x64 / windows-x64 / android-arm64
        uptimeSeconds:
          type: integer
          format: int64
        instances:
          type: object
          properties:
            running:
              type: integer
            total:
              type: integer

    DeviceType:
      type: string
      enum: [desktop, mobile, web]
      description: 设备类别:desktop 桌面应用(Windows/Linux/macOS),mobile 手机(Android/iOS),web 浏览器

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 128
        deviceId:
          type: string
          format: uuid
          description: |
            客户端持久化的设备标识(uuid)。存在该设备记录时复用并轮换 token,
            不会产生新设备;缺省时新建设备记录。
        deviceName:
          type: string
          maxLength: 64
          description: 设备显示名(如 "我的手机" / "办公室电脑")
        deviceType:
          $ref: "#/components/schemas/DeviceType"
          description: 设备类别,用于列表图标区分

    LoginResponse:
      type: object
      required: [token, deviceId]
      properties:
        token:
          type: string
          description: 长期 token(客户端存 secure storage)
        deviceId:
          type: string

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    ChangeUsernameRequest:
      type: object
      required: [newUsername]
      properties:
        newUsername:
          type: string
          maxLength: 64

    LocalLoginChallenge:
      type: object
      required: [challenge, expiresAt]
      properties:
        challenge:
          type: string
          description: 一次性挑战值,5 分钟过期
        expiresAt:
          type: string
          format: date-time

    LocalLoginRequest:
      type: object
      required: [challenge, signature]
      properties:
        challenge:
          type: string
        signature:
          type: string
          description: lowercase(hex(HMAC-SHA256(localKey, challenge))),localKey 为 daemon 数据目录内 local.key 内容
        deviceId:
          type: string
          format: uuid
          description: 同 LoginRequest.deviceId,复用已有设备记录
        deviceName:
          type: string
          maxLength: 64
        deviceType:
          $ref: "#/components/schemas/DeviceType"
          description: 同 LoginRequest.deviceType

    RenameDeviceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    DeviceInfo:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        deviceType:
          $ref: "#/components/schemas/DeviceType"
          description: 设备类别,前端据此选择列表图标
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ────────── 玩家管理 ──────────
    PlayerNamedEntry:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 玩家名(文本名单无 uuid 时为空串)
        uuid:
          type: string
          description: 玩家 UUID,文本名单(white-list.txt 等)为空串

    PlayerBanEntry:
      type: object
      required: [name]
      properties:
        name:
          type: string
        uuid:
          type: string
        reason:
          type: string
          description: 封禁原因;文本名单为空串
        source:
          type: string
          description: 封禁来源(执行人);文本名单为空串
        expires:
          type: string
          description: 过期时间(Java 用 expires,PNX 用 expireDate,已归一化);文本名单为空串
        created:
          type: string
          description: 创建时间(Java 用 created,PNX 用 creationDate,已归一化);文本名单为空串

    PlayerIpBanEntry:
      type: object
      required: [ip]
      properties:
        ip:
          type: string
        reason:
          type: string
        source:
          type: string
        expires:
          type: string
        created:
          type: string

    PlayerSnapshot:
      type: object
      required: [instanceStatus, online, whitelist, ops, bans, banIps]
      properties:
        instanceStatus:
          $ref: "#/components/schemas/InstanceStatus"
          description: 实例运行状态(仅 running 时增删操作才被服务端接受)
        online:
          type: array
          items:
            type: string
          description: 在线玩家名(daemon 解析控制台输出维护,按名排序)
        whitelist:
          type: array
          items:
            $ref: "#/components/schemas/PlayerNamedEntry"
        ops:
          type: array
          items:
            $ref: "#/components/schemas/PlayerNamedEntry"
        bans:
          type: array
          items:
            $ref: "#/components/schemas/PlayerBanEntry"
        banIps:
          type: array
          items:
            $ref: "#/components/schemas/PlayerIpBanEntry"

    # ────────── 实例 ──────────
    InstanceStatus:
      type: string
      enum: [busy, stopped, stopping, starting, running]
      description: 五态状态机(对齐 MCSManager)

    InstanceType:
      type: string
      enum: [minecraft-java, minecraft-bedrock, pocketmine, generic]
      description: 附加层类型;generic 为纯通用进程,创建时缺省 generic

    InstanceConfig:
      type: object
      required: [name]
      description: |
        实例配置。创建时仅 name 必填:startCommand 可为空串(空实例,创建后再导入服务端配置),
        workingDirectory 缺省由 daemon 分配 {dataDir}/files/{id}。
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: 服务端生成
        name:
          type: string
          maxLength: 64
        startCommand:
          type: string
          default: ""
          description: 命令行字符串(支持引号/转义,解析为参数数组 spawn,不经 shell);空串表示尚未配置启动命令
        stopCommand:
          type: string
          default: "^C"
          description: 优雅停止命令;^C 表示发送 Ctrl+C
        stopTimeoutSeconds:
          type: integer
          default: 600
          description: 优雅停止超时,超时升级强杀
        workingDirectory:
          type: string
          description: 工作目录(实例 cwd,文件沙箱根);创建/更新时缺省由 daemon 维护为实例专属目录,不随实例删除
        environment:
          type: object
          additionalProperties:
            type: string
          description: 额外环境变量
        inputEncoding:
          $ref: "#/components/schemas/Encoding"
        outputEncoding:
          $ref: "#/components/schemas/Encoding"
        autoRestart:
          type: boolean
          default: false
          description: 异常/正常退出后自动重启
        autoRestartMaxTimes:
          type: integer
          default: -1
          description: 重启次数上限;-1 无限
        autoStartOnBoot:
          type: boolean
          default: false
          description: daemon 启动时自动拉起
        terminal:
          type: object
          properties:
            pty:
              type: boolean
              default: true
            initialCols:
              type: integer
              default: 164
            initialRows:
              type: integer
              default: 40
            haveColor:
              type: boolean
              default: true
              description: 是否把 Minecraft §x 色码转 ANSI
        type:
          $ref: "#/components/schemas/InstanceType"
        runtimeId:
          type: string
          nullable: true
          description: |
            引用已安装运行时(runtimes 的 RuntimeInfo.id,如 java 指定 JRE 版本)。
            为空表示未指定,启动命令中的可执行文件需自行可用。
        downloadUrl:
          type: string
          nullable: true
          description: |
            创建实例时的服务端下载链接(http/https)。仅在创建时生效:
            daemon 收到后自动发起下载任务(下载到实例工作目录),下载完成前实例暂不可启动。
            更新实例时忽略本字段。
        fileName:
          type: string
          nullable: true
          description: |
            下载目标文件名(仅与 downloadUrl 配合,创建时生效)。缺省由 daemon
            从 URL 末段推导(如 https://.../paper-1.21.1-198.jar → paper-1.21.1-198.jar);
            建议取 /catalog/download-info 返回的 fileName。
        checksum:
          type: string
          nullable: true
          description: |
            下载校验值,格式 "sha1:<hex>" 或 "sha256:<hex>"(aria2 风格,不填则不做校验)。
            仅与 downloadUrl 配合使用,下载完成后按算法强校验,不一致视为失败。
        downloadTaskId:
          type: string
          format: uuid
          nullable: true
          description: |
            创建实例触发的下载任务 id(只读)。创建后经 `GET /tasks/{jobId}`
            查询下载进度;下载完成后保留,便于追溯。
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Encoding:
      type: string
      enum: [utf-8, gbk, big5, shift_jis, euckr, gb18030, utf-16]
      default: utf-8

    InstanceSummary:
      type: object
      required: [id, name, status, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: "#/components/schemas/InstanceStatus"
        type:
          $ref: "#/components/schemas/InstanceType"
        pid:
          type: integer
          nullable: true
        runningSince:
          type: string
          format: date-time
          nullable: true
        autoRestart:
          type: boolean
        autoStartOnBoot:
          type: boolean
        port:
          type: integer
          nullable: true
          description: 附加层解析出的服务端监听端口
        onlinePlayers:
          type: integer
          nullable: true
          description: 附加层解析出的在线人数

    InstancePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstanceSummary"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    InstanceOverview:
      type: object
      required: [items, running, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstanceSummary"
        running:
          type: integer
        total:
          type: integer

    InstanceDetail:
      type: object
      required: [config, status]
      properties:
        config:
          $ref: "#/components/schemas/InstanceConfig"
        status:
          $ref: "#/components/schemas/RunStatus"

    RunStatus:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/InstanceStatus"
        pid:
          type: integer
          nullable: true
          description: 真实游戏进程 PID(PTY 握手获得)
        exitCode:
          type: integer
          nullable: true
          description: 上次退出码
        serverPort:
          type: integer
          nullable: true
        onlineMode:
          type: boolean
          nullable: true
        onlinePlayers:
          type: array
          items:
            type: string
          description: 当前在线玩家名
        logSeq:
          type: integer
          format: int64
          description: 当前日志行序号(供 /log?since= 续拉)

    CommandRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          description: 一行命令(自动补换行)

    LogResponse:
      type: object
      required: [lines, nextSeq]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LogLine"
        nextSeq:
          type: integer
          format: int64
          description: 下一条起始序号

    LogLine:
      type: object
      required: [seq, text]
      properties:
        seq:
          type: integer
          format: int64
          description: 单调递增行序号
        ts:
          type: string
          format: date-time
        text:
          type: string
          description: 去 ANSI 的纯文本行

    ProcessConfig:
      type: object
      additionalProperties:
        type: string
      description: 配置文件键值(值一律字符串,大整数不丢精度)

    ExportRequest:
      type: object
      properties:
        format:
          type: string
          enum: [zip, tar.gz]
          default: zip
        includeLogs:
          type: boolean
          default: false

    ImportRequest:
      type: object
      required: [sourceInstanceId, archivePath]
      properties:
        sourceInstanceId:
          type: string
          format: uuid
          description: 归档所在实例 id(先经 /fs/upload-* 上传到该实例 cwd)
        archivePath:
          type: string
          description: 导出归档在其 cwd 内的相对路径(先经 /fs/upload-* 上传)

    ServerCoreUpdateCheck:
      type: object
      required: [supported]
      properties:
        supported:
          type: boolean
          description: 该实例是否支持服务端核心更新(当前仅 Paper 系 java 实例)
        source:
          type: string
          enum: [paper, unknown]
          description: 检测到的更新源(paper = PaperMC 官方 API)
        currentVersion:
          type: string
          description: 当前服务端核心版本(如 1.21.4);未知时为空串
        currentBuild:
          type: string
          description: 当前核心构建号(如 214);未知时为空串
        latestVersion:
          type: string
          description: 最新可用版本(如 1.21.4)
        latestBuild:
          type: string
          description: 最新构建号(如 214)
        downloadUrl:
          type: string
          description: 最新版核心 jar 下载地址
        sha256:
          type: string
          description: 下载文件 sha256(64 位 hex)
        updateAvailable:
          type: boolean
          description: 当前是否有可用更新(版本/构建与已装核心不一致)

    ServerCoreUpdateRequest:
      type: object
      required: [downloadUrl]
      properties:
        downloadUrl:
          type: string
          description: 目标核心 jar 下载地址(通常来自 GET core-update/check 的 downloadUrl)
        sha256:
          type: string
          description: 下载校验值(sha256 hex 或 "sha1:<hex>";为空不做校验)
        fileName:
          type: string
          description: 落盘文件名替换(缺省为检测到的当前核心 jar 名,如 server.jar)

    JobAccepted:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
          description: 异步任务 id(= Task.id;状态/进度经 WS `task/progress` 推送,可用 GET /tasks/{jobId} 查询)

    # ────────── 任务队列(Tasks) ──────────
    TaskStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
      description: 任务状态机:queued 排队 → running 执行中 → succeeded/failed 终结;queued/running 可被取消 → cancelled

    TaskKind:
      type: string
      enum: [start, stop, restart, kill, download, export, import, backup, compress, extract, analyze, download_single_file, core_update]
      description: |
        任务类型。实例操作(start/stop/restart/kill)、归档操作(compress/extract)与
        导出/导入(export/import)按 instanceId 分组 FIFO 串行,同一实例同 kind 未结束的
        任务重复提交将被拒绝(409 task_conflict)。export 打包实例工作目录为归档并写入
        exports 目录;import 从实例 cwd 内的归档还原为新实例。core_update 按
        POST /instances/{id}/core-update 的请求下载并替换服务端核心 jar。
        analyze 为插件/模组元数据解析(后端解析,前端轮询后拉取结果)。
        download_single_file 为通用单文件下载(每个任务内部绑定一个 aria2 下载任务 gid,
        模组/插件等单文件下载复用):同一实例允许多个排队,按 instanceId 分组 FIFO
        串行执行(一个完成再下一个),允许覆盖同名目标文件,前端负责按目标路径去重。

    TaskProgress:
      type: object
      properties:
        receivedBytes:
          type: integer
          format: int64
          nullable: true
        totalBytes:
          type: integer
          format: int64
          nullable: true
        speedBytesPerSec:
          type: integer
          format: int64
          nullable: true
          description: 下载速度(字节/秒)
        etaSeconds:
          type: integer
          format: int64
          nullable: true
          description: 预计还需时间(秒,依据当前速度推算;无法推算时为 null)
        percent:
          type: number
          format: float
          nullable: true
          description: 0~1;未知大小(null)

    Task:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 任务 id(= JobAccepted.jobId)
        kind:
          $ref: "#/components/schemas/TaskKind"
        displayName:
          type: string
          nullable: true
          description: 用户可读展示标题(如「模组名 v1.2」,download_single_file 等使用);无时为 null
        instanceId:
          type: string
          format: uuid
          nullable: true
          description: 关联实例;全局任务(下载运行时等)为 null
        status:
          $ref: "#/components/schemas/TaskStatus"
        phase:
          type: string
          description: 执行阶段描述(如 start 的 launching / 下载的 fetching);无阶段概念时为 null
          nullable: true
        progress:
          $ref: "#/components/schemas/TaskProgress"
        error:
          type: object
          description: 失败原因(status=failed 时非空)
          properties:
            code:
              type: string
            message:
              type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true

    TaskList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
          description: 过滤后的任务总数

    # ────────── 运行时 ──────────
    RuntimeType:
      type: string
      enum: [java, php, frpc]

    RuntimeInfo:
      type: object
      required: [id, type, version, path, installedAt]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/RuntimeType"
        version:
          type: string
        arch:
          type: string
          example: x64 / arm64
        path:
          type: string
          description: 统一运行时目录内的绝对路径
        sizeBytes:
          type: integer
          format: int64
        installedAt:
          type: string
          format: date-time
        default:
          type: boolean
          description: 是否默认版本

    RuntimeCatalogEntry:
      type: object
      required: [version]
      properties:
        version:
          type: string
        url:
          type: string
          description: 官方源下载地址
        sha256:
          type: string
        sizeBytes:
          type: integer
          format: int64

    RuntimeCatalog:
      type: object
      required: [type, entries]
      properties:
        type:
          $ref: "#/components/schemas/RuntimeType"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeCatalogEntry"

    RuntimeInstallRequest:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/RuntimeType"
        version:
          type: string
          description: 缺省取 catalog 推荐版本
        arch:
          type: string
          description: 缺省取当前平台架构
        url:
          type: string
          description: 覆盖官方源地址(开发者选项)

    # ────────── Frp(内网穿透) ──────────
    ProxyType:
      type: string
      enum: [tcp, udp, http, https]
      description: 代理协议类型

    TunnelProxy:
      type: object
      required: [name, type, localIp, localPort]
      properties:
        name:
          type: string
          description: 代理名称(隧道内唯一)
        type:
          $ref: "#/components/schemas/ProxyType"
        localIp:
          type: string
          description: 本地服务地址(如 127.0.0.1)
        localPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        remotePort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: tcp/udp 必填;http/https 无需
        customDomains:
          type: array
          items:
            type: string
          description: http/https 必填(至少一个域名);tcp/udp 忽略

    TunnelInfo:
      type: object
      required: [id, name, serverAddr, serverPort, proxies, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        serverAddr:
          type: string
          description: frps 服务端地址(域名/IP)
        serverPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        user:
          type: string
          nullable: true
          description: frps 用户名(可选)
        authToken:
          type: string
          nullable: true
          description: frps 鉴权 token(可选)
        proxies:
          type: array
          items:
            $ref: "#/components/schemas/TunnelProxy"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TunnelInput:
      type: object
      required: [name, serverAddr, serverPort, proxies]
      properties:
        name:
          type: string
        serverAddr:
          type: string
        serverPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        user:
          type: string
          nullable: true
        authToken:
          type: string
          nullable: true
        proxies:
          type: array
          items:
            $ref: "#/components/schemas/TunnelProxy"

    FrpStatus:
      type: object
      required: [running]
      properties:
        running:
          type: boolean
        tunnelId:
          type: string
          format: uuid
          description: 运行中的隧道(未运行时缺省)
        startedAt:
          type: string
          format: date-time
          description: 本次启动时间(未运行时缺省)
        exitCode:
          type: integer
          format: int32
          description: 未运行时的上次退出码(无记录时缺省)

    # ────────── 服务端版本目录(Catalog) ──────────
    ServerTypeInfo:
      type: object
      required: [type, category, fileName]
      description: |
        服务端类型静态定义。「下载服务端」向导数据源,分类结构与 V1 对齐。
      properties:
        type:
          type: string
          description: 类型 id,如 vanilla / paper / spigot / craftbukkit / purpur / leaf / leaves / velocity / bungeecord / fabric / pocketmine / powernukkitx / allay
        category:
          type: string
          enum: [vanilla, plugin, mod, proxy, bedrock]
        hasLoader:
          type: boolean
          default: false
          description: true 时版本页选择 MC 版本后需经 /catalog/loaders 选加载器版本(目前仅 fabric)
        fileName:
          type: string
          description: 该类型默认落盘文件名(如 server.jar / bungeecord.jar / PocketMine-MP.phar);下载信息可覆盖

    ServerVersion:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: 版本号(降序)
        meta:
          type: object
          additionalProperties: true
          description: 附加信息(可选):raw.githubusercontent.com 等来源的说明字段,如 pocketmine/powernukkitx 的客户端版本

    ServerDownloadInfo:
      type: object
      required: [url, fileName]
      properties:
        url:
          type: string
          description: 服务端直链(http/https)
        fileName:
          type: string
          description: 建议落盘文件名(写入实例工作目录;创建实例时可经 InstanceConfig.fileName 覆盖)
        checksum:
          type: string
          nullable: true
          description: |
            校验值,"sha1:<hex>" 或 "sha256:<hex>"(daemon 下载完成后强校验,
            与 InstanceConfig.checksum 同构;无校验值的源返回 null)
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: 可选,源不提供时为 null

    # ────────── 插件/模组元数据 ──────────
    ModLoader:
      type: string
      enum: [fabric, forge, quilt, neoforge, bukkit, bungeecord, velocity, pocketmine, unknown]
      description: 插件/模组加载器类型(lowercase)

    ModMetadata:
      type: object
      required: [name, loader]
      properties:
        name:
          type: string
        version:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        modId:
          type: string
          nullable: true
          description: 模组 id / 插件主类等标识
        authors:
          type: string
          nullable: true
          description: 逗号分隔的作者/贡献者
        url:
          type: string
          nullable: true
        loader:
          $ref: "#/components/schemas/ModLoader"

    ModMetadataEntry:
      type: object
      required: [path, name, sizeBytes, metadata]
      properties:
        path:
          type: string
          description: 相对实例 cwd 的路径
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha1:
          type: string
          nullable: true
          description: 文件 SHA1(小写 hex),供更新检查(Modrinth version_files)与图标查询
        iconUrl:
          type: string
          nullable: true
          description: 图标 URL(后端经 Modrinth 查询,尽力而为;失败/不可得为 null)
        metadata:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ModMetadata"
          description: 未识别/未解析时为 null

    ModMetadataListResponse:
      type: object
      required: [path, items]
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModMetadataEntry"

    ModsAnalyzeRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 相对实例 cwd 的目录,如 plugins / mods

    # ────────── 插件/模组下载与市场 ──────────
    ModDownloadRequest:
      type: object
      required: [url, destPath]
      properties:
        url:
          type: string
          description: 文件下载地址(HTTP/HTTPS)
        destPath:
          type: string
          description: 目标目录,相对实例 cwd(如 mods / plugins)
        fileName:
          type: string
          nullable: true
          description: 落盘文件名;缺省取 URL 末段
        displayName:
          type: string
          nullable: true
          description: 用户可读展示标题(如「模组名 v1.2」),用于任务列表显示
        replacePath:
          type: string
          nullable: true
          description: |
            更新替换:下载成功后把该旧文件(相对实例 cwd)重命名为
            `<replacePath>.disabled`(禁用旧版而非删除);文件不存在时静默跳过。

    ModrinthSearchResponse:
      type: object
      required: [hits, offset, limit, totalHits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/ModrinthSearchHit"
        offset:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        totalHits:
          type: integer
          format: int64

    ModrinthSearchHit:
      type: object
      required: [slug, projectId, title, projectType]
      properties:
        slug:
          type: string
        projectId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        categories:
          type: array
          items: { type: string }
        versions:
          type: array
          items: { type: string }
        projectType:
          type: string
        iconUrl:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        downloads:
          type: integer
          format: int64
        follows:
          type: integer
          format: int64
        latestVersion:
          type: string
          nullable: true

    ModrinthVersion:
      type: object
      required: [id, projectId, versionNumber]
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
          nullable: true
        versionNumber:
          type: string
        gameVersions:
          type: array
          items: { type: string }
        loaders:
          type: array
          items: { type: string }
        files:
          type: array
          items:
            $ref: "#/components/schemas/ModrinthVersionFile"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/ModrinthDependency"

    ModrinthVersionFile:
      type: object
      required: [url, filename, primary]
      properties:
        url:
          type: string
        filename:
          type: string
        primary:
          type: boolean
        size:
          type: integer
          format: int64
        hashes:
          $ref: "#/components/schemas/ModrinthFileHashes"

    ModrinthFileHashes:
      type: object
      properties:
        sha1:
          type: string
          nullable: true
        sha512:
          type: string
          nullable: true

    ModrinthDependency:
      type: object
      required: [dependencyType]
      properties:
        projectId:
          type: string
          nullable: true
        versionId:
          type: string
          nullable: true
        dependencyType:
          type: string

    ModrinthProject:
      type: object
      required: [id, slug, title, projectType]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        iconUrl:
          type: string
          nullable: true
        projectType:
          type: string

    PoggitPlugin:
      type: object
      description: Poggit releases.min.json 条目(字段为便于前端使用的子集,其它字段忽略)
      required: [name]
      properties:
        name:
          type: string
        version:
          type: string
          nullable: true
        api:
          type: array
          items: { type: string }
        tag:
          type: array
          items: { type: string }
        last_update:
          type: integer
          format: int64
        dl:
          type: integer
          format: int64
        icon:
          type: string
          nullable: true
        artifact_url:
          type: string
          nullable: true

    # ────────── 文件 ──────────
    FileEntry:
      type: object
      required: [name, path, isDirectory, sizeBytes, modifiedAt]
      properties:
        name:
          type: string
        path:
          type: string
          description: 相对实例 cwd 的路径
        isDirectory:
          type: boolean
        sizeBytes:
          type: integer
          format: int64
        modifiedAt:
          type: string
          format: date-time
        executable:
          type: boolean
          nullable: true

    FileListResponse:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"

    UploadInitRequest:
      type: object
      required: [instanceId, path, fileName, sizeBytes]
      properties:
        instanceId:
          type: string
        path:
          type: string
          description: 目标目录(相对实例 cwd)
        fileName:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
          description: 可选,complete 时校验
        autoExtract:
          type: boolean
          default: false
          description: 完成自动解压(服务端整合包场景)

    UploadSession:
      type: object
      required: [uploadId, receivedBytes]
      properties:
        uploadId:
          type: string
        receivedBytes:
          type: integer
          format: int64
          description: 已接收字节(断点续传:重连后从该偏移继续)

    UploadProgress:
      type: object
      required: [uploadId, receivedBytes, totalBytes]
      properties:
        uploadId:
          type: string
        receivedBytes:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64

    UploadCompleteRequest:
      type: object
      required: [uploadId]
      properties:
        uploadId:
          type: string

    UploadCompleteResponse:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 落盘路径(相对实例 cwd)

    FsWriteRequest:
      type: object
      required: [instanceId, path, content]
      properties:
        instanceId:
          type: string
        path:
          type: string
          description: 目标文件路径(相对实例 cwd),父目录须已存在
        content:
          type: string
          description: UTF-8 文本内容(上限 16 MiB)

    FsPathRequest:
      type: object
      required: [instanceId, path]
      properties:
        instanceId:
          type: string
        path:
          type: string

    FsMoveRequest:
      type: object
      required: [instanceId, from, to]
      properties:
        instanceId:
          type: string
        from:
          type: string
        to:
          type: string

    FsCompressRequest:
      type: object
      required: [instanceId, path]
      properties:
        instanceId:
          type: string
        path:
          type: string
          description: 待压缩目录/文件
        destName:
          type: string
          description: 归档文件名,缺省取源名

    # ────────── 备份 ──────────
    BackupTargetType:
      type: string
      enum: [local, ftp, sftp]

    BackupTarget:
      type: object
      required: [id, name, type, path]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/BackupTargetType"
        host:
          type: string
          nullable: true
        port:
          type: integer
          nullable: true
        username:
          type: string
          nullable: true
        path:
          type: string
          description: 目标目录(local 为绝对路径;ftp/sftp 为远端路径)
        encryptedPassword:
          type: string
          nullable: true
          writeOnly: true
          description: 可选;设置后服务端加密存储
        createdAt:
          type: string
          format: date-time
          readOnly: true

    BackupJob:
      type: object
      required: [id, name, instanceId]
      properties:
        id:
          type: string
        name:
          type: string
        instanceId:
          type: string
          description: 备份哪个实例
        scheduleCron:
          type: string
          nullable: true
          description: 定时表达式(如 "0 4 * * *");null 为仅手动
        targetIds:
          type: array
          items:
            type: string
          description: 备份目标;空为仅本地
        enabled:
          type: boolean
          default: true
        maxKeep:
          type: integer
          default: 10
          description: 保留最近 N 份
        includeDirs:
          type: array
          items:
            type: string
          description: 相对 cwd 的附加目录;空为整个工作目录
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        lastResult:
          type: string
          enum: [success, failed, running]
          nullable: true
          readOnly: true

    # ────────── FTP / SSH ──────────
    FtpConfig:
      type: object
      required: [enabled, port, username]
      properties:
        enabled:
          type: boolean
        port:
          type: integer
          default: 2121
        username:
          type: string
        password:
          type: string
          writeOnly: true
        rootDir:
          type: string
          nullable: true
          description: 根目录;null 跟随当前选中实例 cwd

    FtpStatus:
      allOf:
        - $ref: "#/components/schemas/FtpConfig"
        - type: object
          properties:
            running:
              type: boolean
            connections:
              type: integer
              default: 0

    SshConfig:
      type: object
      required: [enabled, port, username]
      properties:
        enabled:
          type: boolean
        port:
          type: integer
          default: 2222
        username:
          type: string
        password:
          type: string
          writeOnly: true
          description: 密码登录;留空则仅密钥
        rootDir:
          type: string
          nullable: true

    SshStatus:
      allOf:
        - $ref: "#/components/schemas/SshConfig"
        - type: object
          properties:
            running:
              type: boolean
            connections:
              type: integer
              default: 0

    # ────────── 配置 ──────────
    ConfigEntry:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          description: 设置项名(locale/theme/network/developer/terminal/download 等)
        value:
          type: object
          additionalProperties: true
          description: 任意 JSON 值

    # ────────── 监控 ──────────
    MonitorSnapshot:
      type: object
      required: [cpuPercent, memoryTotalBytes, memoryUsedBytes, uptimeSeconds]
      properties:
        cpuPercent:
          type: number
          format: float
        memoryTotalBytes:
          type: integer
          format: int64
        memoryUsedBytes:
          type: integer
          format: int64
        disks:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              totalBytes:
                type: integer
                format: int64
              usedBytes:
                type: integer
                format: int64
        networkRxBytesPerSec:
          type: integer
          format: int64
        networkTxBytesPerSec:
          type: integer
          format: int64
        uptimeSeconds:
          type: integer
          format: int64