name: edgecube_app
description: Minecraft Server Tool
homepage: https://edgecubemc.com
repository: https://github.com/venti1112/EdgeCube
issue_tracker: https://github.com/venti1112/EdgeCube/issues
documentation: https://edgecubemc.com/#docs
publish_to: 'none'
platforms:
  android:
  windows:
  linux:
  web:

version: 2.0.0+200

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  flutter_i18n: ^0.37.1
  dynamic_color: ^2.1.0
  flex_color_picker: ^3.8.0
  just_storage: ^1.2.1
  material_ui: ^1.0.1
  file_picker: ^12.1.2
  path_provider: ^2.1.0
  path: ^1.9.1
  dio: ^5.7.0
  share_plus: ^13.3.0
  crypto: ^3.0.0
  re_highlight: ^0.0.3
  re_editor:
    git:
      url: https://github.com/venti1112/re-editor
      ref: main
  edgecube_api_client:
    path: ../proto/gen/dart
  built_collection: ^5.1.1
  xterm2: ^5.2.0
  web_socket_channel: ^3.0.3
  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
