name: edgecube
description: Minecraft Server Tool
homepage: https://edgecubemc.com
repository: https://github.com/venti1112/EdgeCube
issue_tracker: https://github.com/venti1112/EdgeCube/issues
documentation: https://edgecubemc.com/#docs
publish_to: 'none'
platforms:
  android:
  windows:
  linux:
  web:

version: 2.0.0+200

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  riverpod: ^3.4.2
  go_router: ^17.5.0
  flutter_i18n: ^0.37.1
  dynamic_color: ^2.1.0
  flex_color_picker: ^3.8.0
  liquid_glass_widgets: ^0.30.2
  just_storage: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
