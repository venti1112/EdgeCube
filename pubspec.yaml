name: edgecube
description: Run Minecraft server on Android
homepage: https://edgecubemc.com
repository: https://github.com/venti1112/EdgeCube
issue_tracker: https://github.com/venti1112/EdgeCube/issues
documentation: https://edgecubemc.com/#docs
publish_to: 'none'
platforms:
  android:

version: 1.0.7+33

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.7
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0
  battery_optimization_helper: ^0.2.0
  downloadx: ^0.3.0
  share_plus: ^13.3.1
  image: ^4.12.0
  archive: ^4.5.2
  flutter_markdown_plus: ^1.0.12
  re_highlight: ^0.0.3
  flutter_svg: ^2.3.0
  pinenacl: ^0.6.0
  logging: ^1.3.0
  flutter_miuix: ^1.3.0
  mcp_dart: ^2.4.3
  ftpconnect: ^3.0.0
  dartssh2: ^4.1.0
  xterm2:
    git:
      url: https://github.com/venti1112/xterm2
      ref: 4ca5c6588901e348fc185f83cf9436fdd01bc149
  port_forwarder:
    git:
      url: https://github.com/venti1112/port_forwarder
      ref: master
  re_editor:
    git:
      url: https://github.com/venti1112/re-editor
      ref: main
  webdav_client_plus:
    git:
      url: https://github.com/venti1112/webdav_client
      ref: main

dependency_overrides:
  dartssh2: ^4.1.0
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/i18n/
    - assets/markdown/
    - assets/rules/
