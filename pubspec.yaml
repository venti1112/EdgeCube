name: edgecube
description: "Run Minecraft server on Android"
publish_to: 'none'

version: 1.0.0-beta24+24

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.7
  port_forwarder: ^1.0.0
  dynamic_color: ^1.8.1
  flex_color_picker: ^3.8.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  battery_optimization_helper: ^0.2.0
  downloadx: ^0.3.0
  share_plus: ^13.3.0
  xterm: ^4.0.0
  mcp_dart: ^2.2.2
  image: ^4.8.0
  archive: ^4.0.9
  flutter_markdown_plus: ^1.0.12
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  flutter_svg: ^2.3.0
  pinenacl: ^0.6.0
  flutter_miuix: ^1.0.9
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/i18n/
    - assets/markdown/
    - assets/rules/
